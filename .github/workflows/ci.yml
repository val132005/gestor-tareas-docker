name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# El workflow solo necesita leer el código
permissions:
  contents: read

jobs:
  pruebas-unitarias:
    name: Pruebas unitarias (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Auditoría de dependencias (vulnerabilidades altas)
        run: npm audit --omit=dev --audit-level=high

      - name: Ejecutar pruebas
        run: npm test

  integracion-docker:
    name: Contenedores y comunicación app <-> db
    needs: pruebas-unitarias
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Crear .env con contraseñas aleatorias (no se guardan secretos en el repositorio)
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^APP_DB_PASSWORD=.*/APP_DB_PASSWORD=$(openssl rand -hex 16)/" .env

      - name: Validar docker-compose.yml
        run: docker compose config --quiet

      - name: Construir imágenes y levantar contenedores
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Estado de los contenedores
        run: docker compose ps

      - name: Prueba de comunicación entre contenedores
        run: bash scripts/prueba-comunicacion.sh

      - name: Logs de los contenedores (si algo falla)
        if: failure()
        run: docker compose logs

      - name: Apagar y limpiar
        if: always()
        run: docker compose down -v
