<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de tareas</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <header>
      <h1>Gestor de tareas</h1>
      <p class="subtitulo">Node.js + Express en un contenedor, PostgreSQL en otro, comunicados por Docker Compose.</p>
      <p id="estado" class="estado" role="status">Comprobando conexión con la base de datos...</p>
    </header>

    <form id="form-tarea" class="tarjeta" autocomplete="off">
      <label for="titulo">Título</label>
      <input id="titulo" name="titulo" maxlength="120" required placeholder="Ej.: Tomar capturas de docker ps">
      <label for="descripcion">Descripción (opcional)</label>
      <textarea id="descripcion" name="descripcion" maxlength="1000" rows="2"></textarea>
      <button type="submit">Agregar tarea</button>
      <p id="mensaje" class="mensaje" aria-live="polite"></p>
    </form>

    <section class="tarjeta">
      <h2>Tareas <span id="contador" class="contador"></span></h2>
      <ul id="lista" class="lista"></ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
